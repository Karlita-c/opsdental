# ── Balanceo de cargas — Upstream pools ─────────────────────────────────────
# Para escalar: agrega más réplicas en el pool y usa 'docker compose scale backend=3'

upstream backend_pool {
    server backend:9000;
    # server backend_2:9000;   # Réplica 2
    # server backend_3:9000;   # Réplica 3
}

upstream frontend_pool {
    server frontend:3000;
    # server frontend_2:3000;
}

# ── API Backend (Laravel PHP-FPM) ────────────────────────────────────────────
server {
    listen 80;
    server_name localhost api.opsdental.local;
    root /var/www/html/public;
    index index.php;

    # Archivos estáticos servidos directamente por Nginx
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rutas Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM via FastCGI — balanceo al pool
    location ~ \.php$ {
        fastcgi_pass   backend_pool;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO $fastcgi_path_info;
        include        fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Denegar acceso a archivos ocultos
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# ── Frontend (Next.js) ───────────────────────────────────────────────────────
server {
    listen 80;
    server_name opsdental.local;

    location / {
        proxy_pass         http://frontend_pool;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket (Hot reload en desarrollo)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
