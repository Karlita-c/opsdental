# ── Balanceo de cargas ───────────────────────────────────────────────────────
upstream backend_pool {
    server backend:9000;
}

upstream frontend_pool {
    server frontend:3000;
}

# ── Configuración de dominio: HTTP → HTTPS (certificado de seguridad) ────────
server {
    listen 80;
    server_name opsdental.com api.opsdental.com n8n.opsdental.com;

    # Webroot para renovación automática de Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirigir todo lo demás a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── API Backend — HTTPS con certificado Let's Encrypt ────────────────────────
server {
    listen 443 ssl;
    server_name api.opsdental.com;
    root /var/www/html/public;
    index index.php;

    # Certificados de seguridad — Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/opsdental.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opsdental.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Headers de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options    "nosniff"                             always;

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass   backend_pool;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* { deny all; }
}

# ── Frontend — HTTPS ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name opsdental.com;

    ssl_certificate     /etc/letsencrypt/live/opsdental.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opsdental.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass         http://frontend_pool;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}

# ── N8N — HTTPS ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name n8n.opsdental.com;

    ssl_certificate     /etc/letsencrypt/live/opsdental.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opsdental.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://n8n:5678;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
