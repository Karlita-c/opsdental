# Extensión de producción: HTTPS + Let's Encrypt
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/production.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_public:/var/www/html/public:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

  frontend:
    environment:
      - NEXT_PUBLIC_API_URL=https://api.opsdental.com

  n8n:
    environment:
      - N8N_HOST=n8n.opsdental.com
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.opsdental.com

  # ── Certificados de seguridad (Let's Encrypt — auto-renovación) ───────────
  certbot:
    image: certbot/certbot
    container_name: opsdental_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
